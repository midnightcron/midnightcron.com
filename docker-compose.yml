services:
  app:
    build: .
    container_name: midnightcron-app
    restart: unless-stopped
    networks:
      - web

  caddy:
    image: caddy:2-alpine
    container_name: midnightcron-caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - web
    depends_on:
      - app

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: midnightcron-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    env_file: .env
    networks:
      - web
    depends_on:
      - caddy

networks:
  web:
    driver: bridge
