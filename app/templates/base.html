<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}midnightcron{% endblock %} &middot; 0 0 * * *</title>
  <meta name="description" content="{% block description %}Personal hub for Robin Worreby's data and tooling projects.{% endblock %}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='svg/midnightcron.svg') }}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='css/site.css') }}?v={{ static_version }}">
</head>
<body>
  <header class="site-header">
    <nav class="container">
      <ul>
        <li>
          <a href="/" class="brand">
            <img class="brand-logo"
                 src="{{ url_for('static', path='svg/midnightcron.svg') }}"
                 alt=""
                 aria-hidden="true"
                 width="36" height="36">
            <strong class="brand-wordmark">midnightcron</strong><span class="prompt-cursor">_</span>
            <code class="brand-cron" aria-label="midnight every day">0 0 * * *</code>
          </a>
        </li>
      </ul>
      <ul>
        <li><a href="/">projects</a></li>
        <li><a href="/about">about</a></li>
        <li><a href="https://github.com/midnightcron" rel="me noopener">github</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container site-footer">
    <small>
      <a href="mailto:robin@worreby.ch">robin@worreby.ch</a>
      &middot;
      <a href="https://github.com/midnightcron" rel="me noopener">github.com/midnightcron</a>
      &middot;
      <a href="https://www.linkedin.com/in/robin-worreby/" rel="me noopener">linkedin</a>
    </small>
  </footer>
</body>
</html>
