<?xml version="1.0" encoding="UTF-8"?>
<!-- Clock face at midnight. Both hands point to 12 (overlapping vertical
     line from center upward). Stroked with currentColor so the logo
     adapts to whatever text color is in scope. Used inline in the site
     header and as favicon.svg. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
     fill="none" stroke="currentColor"
     stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75"
     aria-hidden="true">
  <circle cx="12" cy="12" r="9"/>
  <!-- minute hand: thinner, longer, reaches near the rim -->
  <line x1="12" y1="12" x2="12" y2="4.5"/>
  <!-- hour hand: thicker base, shorter; drawn over the minute hand so
       the overlapping section looks deliberately weighted at the base -->
  <line x1="12" y1="12" x2="12" y2="7.5" stroke-width="2.75"/>
  <!-- tiny marker dot at 12 -->
  <circle cx="12" cy="3.75" r="0.5" fill="currentColor"/>
</svg>
